   <div id="chapter1">

<h3>Wishing you lots of happiness, love, and success. May all your dreams come true! ❤️</h3>

<input type="file" accept="image/*" onchange="showPhoto(event)">

<br><br>

<img id="myPhoto" width="250" hidden>

<h2>শুভ জন্মদিন, Marufa! 🎁</h2>
<p>তোমার জীবন আনন্দ ও সাফল্যে ভরে উঠুক।</p>

<button onclick="goBack()">আগের পাতায় যাও</button>
</div>

    
<script>
    function showChapter() {
        document.getElementById("home").style.display = "none";
        document.getElementById("chapter1").style.display = "block";
    }

    function goBack() {
        document.getElementById("chapter1").style.display = "none";
        document.getElementById("home").style.display = "block";
    }

    function showPhoto(event) {
        const file = event.target.files[0];

        if (file) {
            const photo = document.getElementById("myPhoto");
            photo.src = URL.createObjectURL(file);
            photo.hidden = false;
        }
    }
</script>
